{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="card login-card">
    <h2>管理员登录</h2>
    <div class="sub">智能车竞赛视频平台 · 后台管理入口</div>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label>用户名</label>
        <input class="input" type="text" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" name="password" autocomplete="current-password" required />
      </div>
      <div class="field">
        <label>验证码</label>
        <div class="captcha-row">
          <input class="input" type="text" name="captcha" maxlength="4" autocomplete="off"
                 placeholder="请输入图中字符" required style="flex:1;" />
          <img class="captcha-img" id="captchaImg" src="{{ captcha_img }}" alt="验证码" title="点击刷新换一张" />
        </div>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">登录</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  var captchaImg = document.getElementById('captchaImg');
  if (captchaImg) {
    captchaImg.addEventListener('click', function () {
      fetch('{{ url_for("captcha") }}').then(function (r) { return r.json(); })
        .then(function (d) { captchaImg.src = d.img; });
    });
  }
</script>
{% endblock %}
